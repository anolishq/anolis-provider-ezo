name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: provider-ezo-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!working/**'
              - '!**/*.md'
              - '!**/*.png'
              - '!**/*.svg'

  build-and-test:
    name: ${{ matrix.name }}
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Build and Test (no hardware)
            os: ubuntu-24.04
            configure_preset: dev-release
            build_preset: dev-release
            test_preset: dev-release
            triplet: x64-linux-static
            timeout_minutes: 30
          - name: Windows Build and Test (no hardware)
            os: windows-2025
            configure_preset: dev-windows-release
            build_preset: dev-windows-release
            test_preset: dev-windows-release
            triplet: x64-windows
            timeout_minutes: 45

    steps:
      - name: Checkout anolis-provider-ezo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: anolis-provider-ezo

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Setup vcpkg
        uses: anolishq/.github/.github/actions/setup-vcpkg@c76784aff711e6540d539f6a5c3ea33c63627930 # v2
        with:
          triplet: ${{ matrix.triplet }}

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        working-directory: anolis-provider-ezo
        run: cmake --preset ${{ matrix.configure_preset }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        working-directory: anolis-provider-ezo
        shell: pwsh
        run: cmake --preset ${{ matrix.configure_preset }}

      - name: Build
        working-directory: anolis-provider-ezo
        run: cmake --build --preset ${{ matrix.build_preset }} --parallel

      - name: Test
        working-directory: anolis-provider-ezo
        run: ctest --preset ${{ matrix.test_preset }}

  version-sync:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: anolishq/.github/.github/workflows/version-sync.yml@c76784aff711e6540d539f6a5c3ea33c63627930 # v2
    with:
      python-version: '3.12'
      working-directory: '.'

  ok:
    name: ok
    if: always()
    needs:
      - changes
      - build-and-test
      - version-sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate job results
        run: |
          echo "Job results: ${{ toJSON(needs.*.result) }}"
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
