name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "working/**"
      - "**/*.md"
      - "**/*.png"
      - "**/*.svg"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "working/**"
      - "**/*.md"
      - "**/*.png"
      - "**/*.svg"
  workflow_dispatch:

concurrency:
  group: provider-ezo-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_COMMIT: "66c0373dc7fca549e5803087b9487edfe3aca0a1"

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Build and Test (no hardware)
            os: ubuntu-24.04
            configure_preset: dev-release
            build_preset: dev-release
            test_preset: dev-release
            timeout_minutes: 30
          - name: Windows Build and Test (no hardware)
            os: windows-2022
            configure_preset: dev-windows-release
            build_preset: dev-windows-release
            test_preset: dev-windows-release
            timeout_minutes: 45

    steps:
      - name: Checkout anolis-provider-ezo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: anolis-provider-ezo

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          doNotCache: false

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        working-directory: anolis-provider-ezo
        run: cmake --preset ${{ matrix.configure_preset }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        working-directory: anolis-provider-ezo
        shell: pwsh
        run: cmake --preset ${{ matrix.configure_preset }}

      - name: Build
        working-directory: anolis-provider-ezo
        run: cmake --build --preset ${{ matrix.build_preset }} --parallel

      - name: Test
        working-directory: anolis-provider-ezo
        run: ctest --preset ${{ matrix.test_preset }}

  version-sync:
    uses: anolishq/.github/.github/workflows/version-sync.yml@15f6901a9ef7e845841d371a64addb04b0f7755a # main
    with:
      python-version: '3.12'
      working-directory: '.'
