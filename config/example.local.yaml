provider:
  name: ezo-lab

hardware:
  bus_path: /dev/i2c-1
  # How long an EZO chip needs between a command write and its reply read.
  # One transaction's latency — not a sampling cadence.
  query_delay_us: 300000
  # How often samples are refreshed. This provider has no sampling thread; it
  # samples when the runtime reads it, so set this to the runtime's
  # polling.interval_ms. Signal freshness and the advertised poll hint derive
  # from it, and it warns once per device if the real gap turns out to be
  # longer than declared.
  sample_interval_ms: 2500
  timeout_ms: 300
  retry_count: 2

discovery:
  mode: manual

devices:
  - id: ph0
    type: ph
    label: Tank pH
    address: 0x63
  - id: do0
    type: do
    label: Tank Dissolved Oxygen
    address: 0x61
